plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    enable {
        mcpVersion = minecraft_version
        // ModDevGradle skips recompiling Minecraft when the CI variable is set. The jar it builds that way has every
        // constructor parameter named "o", which javac rejects in anonymous subclasses, so always recompile.
        disableRecompilation = false
    }
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric's build of Mixin; Fabric and NeoForge both bundle Mixin at runtime
    compileOnly group: 'net.fabricmc', name: 'sponge-mixin', version: '0.15.4+mixin.0.8.7'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

