name: Build and test

on:
  push:
    branches: [main, minecraft-1.20.1]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 1.21.1 targets Java 21 and 1.20.1 targets Java 17; Gradle itself runs on 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # Runs the shared game tests on every loader module this branch has
      # (neoforge + fabric on 1.21.1, forge + fabric on 1.20.1). Each run fails on any failed test.
      - name: Game tests
        run: |
          for module in neoforge forge fabric; do
            if [ -d "$module" ]; then
              echo "::group::$module game tests"
              ./gradlew ":$module:runGameTestServer"
              echo "::endgroup::"
            fi
          done

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: futurebackport-jars
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
            !*/build/libs/*-javadoc.jar
