name: Release

# Push a tag v<version> on main to publish a release. Run by hand (Actions tab) for a dry run that builds and
# tests both Minecraft versions without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - minecraft: '1.21.1'
            ref: ''  # the tag (or the branch the dry run was started from)
          - minecraft: '1.20.1'
            ref: minecraft-1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}

      - name: Check that the tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The ${{ matrix.minecraft }} branch has version=$version in gradle.properties, but the tag is $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Game tests
        run: |
          for module in neoforge forge fabric; do
            if [ -d "$module" ]; then
              echo "::group::$module game tests"
              ./gradlew ":$module:runGameTestServer"
              echo "::endgroup::"
            fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
            !*/build/libs/*-javadoc.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: jars
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l jars
          # A version with a suffix (v1.0.0-beta.1) is published as a pre-release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" jars/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "Future Backport ${GITHUB_REF_NAME#v}" \
            --generate-notes "${prerelease[@]}"

  # Uploads each jar to Modrinth and/or CurseForge. Runs only when the repository has the project IDs as
  # Actions variables (MODRINTH_ID, CURSEFORGE_ID) and the matching tokens as secrets (MODRINTH_TOKEN,
  # CURSEFORGE_TOKEN). A site whose token is missing is skipped.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && (vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: neoforge, minecraft: '1.21.1', loader_name: NeoForge }
          - { loader: fabric, minecraft: '1.21.1', loader_name: Fabric }
          - { loader: forge, minecraft: '1.20.1', loader_name: Forge }
          - { loader: fabric, minecraft: '1.20.1', loader_name: Fabric }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: jars
          merge-multiple: true

      - name: Work out the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *alpha*) echo "type=alpha" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "type=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/futurebackport-${{ matrix.loader }}-${{ matrix.minecraft }}-*.jar
          name: Future Backport ${{ steps.version.outputs.version }} (${{ matrix.loader_name }} ${{ matrix.minecraft }})
          version: ${{ steps.version.outputs.version }}+${{ matrix.loader }}-${{ matrix.minecraft }}
          version-type: ${{ steps.version.outputs.type }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}
          changelog: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
